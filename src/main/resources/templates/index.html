<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>一覧画面</title>
</head>
<body>
	<h1>登録フォーム</h1>
		<table>

		<tr>
		    <th>社員名</th>
		    <th>一言</th>
			<th>削除</th>
		</tr>

		<tr th:each="memory : ${memories}">
		    <td th:text="${memory.employee.name}"></td>
		    <td th:text="${memory.text}"></td>
			<td>
				<form th:action="@{/delete/{id}}" th:object="${memory}" method="post">
					<button type="submit">削除</button>
				</form>
			</td>
		</tr>

		</table>
	<p>
		<a href="/add">新規登録</a>
	</p>
</body>
</html>
